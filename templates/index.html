<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Verge IP Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=ui-v2-20260827-3">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
    <main class="app-shell" x-data="app()" x-init="init()" x-cloak>
        <header class="app-header">
            <div class="brand-row">
                <h1>Clash Verge IP Checker</h1>
                <span class="mode-badge" :class="isLanMode ? 'lan' : 'local'" x-text="isLanMode ? 'LAN' : '本机'"></span>
            </div>
            <button class="button quiet header-refresh" type="button" @click="discover" :disabled="isRunning">刷新订阅</button>
        </header>

        <section class="control-card" aria-labelledby="control-title">
            <h2 id="control-title" class="visually-hidden">检测设置</h2>
            <div class="control-grid">
                <label class="field profile-field">
                    <span>订阅</span>
                    <select x-model="selectedUid" :disabled="isRunning || supportedProfiles.length === 0">
                        <template x-for="profile in supportedProfiles" :key="profile.uid">
                            <option :value="profile.uid"
                                x-text="`${profile.name} · ${profile.type === 'remote' ? '远程' : '本地'}${profile.is_current ? ' · 当前' : ''}`">
                            </option>
                        </template>
                    </select>
                </label>

                <label class="mode-control">
                    <span>模式</span>
                    <span class="mode-toggle">
                        <input type="checkbox" x-model="config.fast_mode">
                        <strong x-text="config.fast_mode ? '快速检测' : '完整检测'"></strong>
                    </span>
                </label>

                <label class="field proxy-field">
                    <span>代理组</span>
                    <input type="text" x-model="config.selector_name" placeholder="auto">
                </label>

                <div class="run-actions" aria-label="检测操作">
                    <button class="button quiet" type="button" @click="startCheck(true)"
                        x-show="selectedProfile && selectedProfile.type === 'remote'"
                        :disabled="isRunning || !selectedUid" :aria-busy="runningAction === 'refresh'">
                        <span x-text="runningAction === 'refresh' ? '刷新中' : '刷新并检测'"></span>
                    </button>
                    <button class="button primary" type="button" @click="startCheck(false)"
                        :disabled="isRunning || !selectedUid" :aria-busy="runningAction === 'current'">
                        <span x-text="runningAction === 'current' ? '检测中' : '检测当前'"></span>
                    </button>
                    <button class="button danger quiet" type="button" @click="stopCheck" x-show="isRunning">停止</button>
                </div>
            </div>

            <div class="control-meta" aria-live="polite">
                <span class="run-state" :class="context?.running ? 'ready' : 'idle'">
                    <i aria-hidden="true"></i>
                    <span x-text="context?.running ? '运行中' : '未检测到进程'"></span>
                </span>
                <span x-show="loadedCheckedDate" x-text="`最近 ${loadedCheckedDate}`"></span>
                <span x-show="loadedCheckedDate" x-text="`缓存 ${loadedCached}/${loadedTotal}`"></span>
                <span x-show="loadedCheckedDate" x-text="`${loadedCacheTtlDays} 天缓存`"></span>
                <span class="source-note" x-show="selectedProfile && selectedProfile.type === 'remote'">
                    刷新并检测会读取远程最新配置，不覆盖原文件
                </span>
                <span class="source-note" x-show="selectedProfile && selectedProfile.type === 'local'">本地订阅仅检测当前内容</span>
            </div>

            <template x-if="notice">
                <p class="message notice" role="status" x-text="notice"></p>
            </template>
            <template x-if="error">
                <p class="message error" role="alert" x-text="error"></p>
            </template>

            <details class="settings-details">
                <summary>
                    更多设置
                    <span>数据目录 / 高级 / 配置片段 <strong x-text="unsupportedProfiles.length"></strong></span>
                </summary>
                <div class="settings-grid">
                    <label class="field setting-wide">
                        <span>数据目录</span>
                        <input type="text" x-model="config.app_home" placeholder="自动发现">
                    </label>
                    <label class="field">
                        <span>Clash API</span>
                        <input type="text" x-model="config.clash_api_url" placeholder="http://127.0.0.1:9097">
                    </label>
                    <label class="field setting-wide">
                        <span>API 密钥</span>
                        <input type="password" x-model="config.clash_api_secret"
                            :placeholder="controllerSecretKnown ? '已从本机读取' : '未设置可留空'">
                    </label>
                    <label class="field">
                        <span>输出后缀</span>
                        <input type="text" x-model="config.output_suffix" placeholder="_checked">
                    </label>
                    <label class="field setting-full">
                        <span>跳过关键词</span>
                        <input type="text" x-model="config.skip_keywords_str">
                    </label>
                </div>
                <div class="check-options">
                    <label x-show="selectedProfile && !selectedProfile.is_current">
                        <input type="checkbox" x-model="config.temp_load_profile">临时加载非当前订阅
                    </label>
                    <label x-show="!config.fast_mode">
                        <input type="checkbox" x-model="config.headless">隐藏浏览器窗口
                    </label>
                    <label>
                        <input type="checkbox" x-model="config.force_refresh_ip_cache">忽略 IP 缓存
                    </label>
                </div>
                <details class="fragment-details" x-show="unsupportedProfiles.length > 0">
                    <summary>配置片段 (<span x-text="unsupportedProfiles.length"></span>)</summary>
                    <div class="fragment-list">
                        <template x-for="profile in unsupportedProfiles" :key="profile.uid">
                            <div class="fragment-row">
                                <strong x-text="profile.name"></strong>
                                <span x-text="`${profile.type} · ${profile.reason}`"></span>
                            </div>
                        </template>
                    </div>
                </details>
            </details>
        </section>

        <section class="workspace-card" aria-labelledby="workspace-title">
            <h2 id="workspace-title" class="visually-hidden">检测结果</h2>
            <div class="workspace-toolbar">
                <div class="view-tabs" role="tablist" aria-label="结果视图">
                    <button type="button" role="tab" @click="workspaceView = 'nodes'"
                        :aria-selected="workspaceView === 'nodes'" :class="{ active: workspaceView === 'nodes' }">
                        节点 <strong x-text="nodes.length"></strong>
                    </button>
                    <button type="button" role="tab" @click="workspaceView = 'exports'"
                        :aria-selected="workspaceView === 'exports'" :class="{ active: workspaceView === 'exports' }">
                        导出记录 <strong x-text="exportedFiles.length"></strong>
                    </button>
                </div>
                <div class="metrics" x-show="workspaceView === 'nodes' && nodes.length > 0">
                    <span>已选 <strong x-text="selected.length"></strong></span>
                    <span x-show="loadedCheckedDate">缓存命中 <strong x-text="`${loadedCached}/${loadedTotal}`"></strong></span>
                    <span x-show="dedupeRemoved">去重 <strong x-text="`${rawNodes.length}→${nodes.length}`"></strong></span>
                </div>
                <button x-ref="exportButton" class="button primary export-button" type="button"
                    x-show="workspaceView === 'nodes'" @click="exportYaml"
                    :disabled="isRunning || isExporting || selected.length === 0" :aria-busy="isExporting">
                    <span x-text="isExporting ? '导出中' : `导出 ${selected.length}`"></span>
                </button>
            </div>

            <div class="progress-strip" x-show="showProgress">
                <progress :value="progress" :max="total || 1"></progress>
                <span class="progress-node" x-text="currentNode || '准备检测'"></span>
                <strong x-text="`${progress}/${total}`"></strong>
            </div>

            <div class="nodes-view" role="tabpanel" x-show="workspaceView === 'nodes'">
                <div class="table-wrap" x-show="nodes.length > 0">
                    <table class="nodes-table" aria-label="节点列表">
                        <thead>
                            <tr>
                                <th class="col-select"><input type="checkbox" aria-label="全选节点" @change="toggleAll"
                                        :checked="nodes.length > 0 && selected.length === nodes.length"></th>
                                <th class="col-name">节点</th>
                                <th class="col-ip">IP</th>
                                <th class="col-risk">风险</th>
                                <th class="col-aux" x-show="showAuxMetric" x-text="config.fast_mode ? '共享' : 'Bot'"></th>
                                <th class="col-type">类型</th>
                                <th class="col-status">状态</th>
                                <th class="col-actions">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="node in nodes" :key="node.id">
                                <tr>
                                    <td class="select-cell"><input type="checkbox" :aria-label="`选择 ${node.name}`"
                                            :checked="selected.includes(node.id)" @change="toggleNode(node, $event)"></td>
                                    <td class="name-cell" data-label="节点">
                                        <span x-show="editingId !== node.id" x-text="node.name"
                                            @dblclick="startEdit(node, $event)" class="editable"></span>
                                        <input x-show="editingId === node.id" x-model="editValue" @blur="saveEdit(node)"
                                            @keyup.enter="saveEdit(node)" @keyup.escape="cancelEdit()" class="inline-edit"
                                            :data-edit-node="node.id">
                                    </td>
                                    <td data-label="IP" x-text="node.ip || '—'"></td>
                                    <td data-label="风险"><span class="risk-badge" :class="getRiskClass(node.risk)"
                                            x-text="node.risk || '—'"></span></td>
                                    <td data-label="共享" x-show="showAuxMetric">
                                        <span :class="config.fast_mode ? getSharedClass(node.shared) : getRiskClass(node.bot)"
                                            x-text="(config.fast_mode ? node.shared : node.bot) || '—'"></span>
                                    </td>
                                    <td data-label="类型" x-text="nodeTypeText(node)"></td>
                                    <td data-label="状态"><span :class="statusClass(node)" x-text="statusText(node)"></span></td>
                                    <td class="actions-cell" data-label="操作">
                                        <div class="row-actions">
                                            <button type="button" x-show="editingId !== node.id" class="button quiet"
                                                @click="startEdit(node, $event)">编辑</button>
                                            <button type="button" x-show="editingId === node.id" class="button quiet primary-text"
                                                @mousedown.prevent @click="saveEdit(node)">保存</button>
                                            <button type="button" x-show="editingId === node.id" class="button quiet"
                                                @mousedown.prevent @click="cancelEdit()">取消</button>
                                            <button type="button" x-show="editingId !== node.id" class="button quiet danger"
                                                @click="deleteNode(node)">删除</button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" x-show="nodes.length === 0">
                    <strong x-text="isRunning ? '正在读取节点' : '尚无检测结果'"></strong>
                    <span x-text="isRunning ? '结果会在检测中逐步出现' : '选择订阅后开始检测'"></span>
                    <button class="button primary" type="button" x-show="!isRunning" @click="startCheck(false)"
                        :disabled="!selectedUid">检测当前</button>
                </div>
            </div>

            <div class="exports-view" role="tabpanel" x-show="workspaceView === 'exports'">
                <div class="exports-heading">
                    <span x-text="exportedFiles.length ? `${exportedFiles.length} 个 YAML` : '暂无导出记录'"></span>
                    <button class="button quiet" type="button" @click="loadExportedFiles">刷新</button>
                </div>
                <div class="export-list" x-show="exportedFiles.length > 0">
                    <template x-for="file in exportedFiles" :key="file.filename">
                        <article class="export-row">
                            <div class="file-icon" aria-hidden="true">Y</div>
                            <div class="file-meta">
                                <strong x-text="file.filename"></strong>
                                <span x-text="`${formatFileSize(file.size)} · ${file.modified.replace('T', ' ')}`"></span>
                            </div>
                            <div class="file-actions">
                                <a class="button quiet" :href="file.url" download>下载</a>
                                <button class="button quiet" type="button" x-show="isLanMode && file.mobile_subscription_url"
                                    @click="copyExportedFileUrl(file)" :disabled="copyingExportedFile === file.filename">复制 URL</button>
                                <button class="button quiet" type="button" x-show="isLanMode && file.mobile_subscription_url"
                                    @click="toggleExportDetails(file)"
                                    x-text="expandedExportFile === file.filename ? '收起二维码' : '二维码'"></button>
                            </div>
                            <div class="lan-export-detail"
                                x-show="isLanMode && file.mobile_subscription_url && expandedExportFile === file.filename">
                                <img :src="qrImageUrl(file.mobile_subscription_url)" alt="手机订阅二维码">
                                <code x-text="file.mobile_subscription_url"></code>
                            </div>
                        </article>
                    </template>
                </div>
            </div>
        </section>

        <dialog x-ref="exportModal" @cancel.prevent="closeExportModal">
            <article class="export-dialog">
                <header>
                    <div>
                        <span class="success-mark" aria-hidden="true">✓</span>
                        <div><h3>导出完成</h3><p x-text="exportFilename"></p></div>
                    </div>
                    <button x-ref="modalClose" type="button" aria-label="关闭" class="dialog-close"
                        @click="closeExportModal">×</button>
                </header>
                <p x-show="importMessage" :class="importStatus === 'unknown' ? 'message warning' : 'message notice'"
                    role="status" aria-live="polite" x-text="importMessage"></p>
                <div class="mobile-export-panel" x-show="isLanMode && mobileSubscriptionUrl">
                    <img :src="qrImageUrl(mobileSubscriptionUrl)" alt="手机订阅二维码">
                    <div>
                        <strong>手机订阅</strong>
                        <code x-text="mobileSubscriptionUrl"></code>
                        <button class="button quiet" type="button" @click="copyMobileSubscriptionUrl"
                            :disabled="isCopyingMobileUrl">复制 URL</button>
                    </div>
                </div>
                <footer class="dialog-actions">
                    <button class="button quiet" type="button" @click="downloadYaml">下载 YAML</button>
                    <button class="button quiet" type="button" @click="copyYaml" :disabled="isCopyingYaml">复制 YAML</button>
                    <button class="button primary" type="button" x-show="importStatus === 'new'" @click="importToClash"
                        :disabled="isImporting">首次导入 Clash Verge</button>
                </footer>
            </article>
        </dialog>
    </main>
    <script src="/static/js/app.js?v=ui-v2-20260827-3"></script>
</body>

</html>
